<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Outer ring — represents the "O" in Open -->
  <circle cx="20" cy="20" r="18" stroke="url(#grad)" stroke-width="2.5" fill="none" opacity="0.9"/>
  
  <!-- Inner abstract: two overlapping forms = human + AI symbiosis -->
  <!-- Left lobe — human side (warm) -->
  <path d="M13 14 C13 10, 20 8, 20 14 L20 26 C20 32, 13 30, 13 26 Z" 
        fill="url(#gradWarm)" opacity="0.85"/>
  <!-- Right lobe — AI side (cool) -->
  <path d="M27 14 C27 10, 20 8, 20 14 L20 26 C20 32, 27 30, 27 26 Z" 
        fill="url(#gradCool)" opacity="0.85"/>
  
  <!-- Center connection dot — the "mate" bond -->
  <circle cx="20" cy="20" r="2.5" fill="white" opacity="0.95"/>
  
  <!-- Neural pulse lines -->
  <path d="M20 12 L20 16" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <path d="M20 24 L20 28" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="40" y2="40">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gradWarm" x1="10" y1="10" x2="22" y2="30">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gradCool" x1="30" y1="10" x2="18" y2="30">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
</svg>
